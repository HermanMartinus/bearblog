{% extends 'dashboard/base.html' %}

{% block content %}
<h1>Delete account</h1>
<p class="button-row">
    <button type="button" onclick="event.preventDefault(); window.location = '/dashboard/'">&#8592; Back</button>
</p>
<form action="" method="post">{% csrf_token %}
    <p>Are you sure you want to delete all information (including all blogs and content) related to <b>{{ request.user.email }}</b>?</p>
    <input type="submit" class="danger" value="Confirm">
</form>
{% endblock %}
