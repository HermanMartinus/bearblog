{% extends 'dashboard/base.html' %}

{% block title %}Post template – Bear Blog{% endblock %}

{% block content %}
<h1>Post template</h1>
<form method="POST" class="post-form full-width">
    {% csrf_token %}
    <p>
        <button type="button" onclick="event.preventDefault(); window.location = '/{{ blog.subdomain }}/dashboard/posts/'">&#8592; Back</button>
        <button type="submit">Update</button>
    </p>
    {{ form.as_p }}
</form>
{% endblock %}
